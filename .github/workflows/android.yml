name: Bastion Browser

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths: ["BastionBrowser/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["BastionBrowser/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BastionBrowser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Filter engine and app tests
        run: ./gradlew :adblock:test :app:testDebugUnitTest --stacktrace

      - name: Content runtime tests (headless Chromium)
        working-directory: BastionBrowser/tools/jstest
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node test.js

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.BASTION_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "BASTION_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          BASTION_KEYSTORE_PASSWORD: ${{ secrets.BASTION_KEYSTORE_PASSWORD }}
          BASTION_KEY_ALIAS: ${{ secrets.BASTION_KEY_ALIAS }}
          BASTION_KEY_PASSWORD: ${{ secrets.BASTION_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "BastionBrowser-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BastionBrowser-apk
          path: BastionBrowser/BastionBrowser-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BastionBrowser/BastionBrowser-*.apk
